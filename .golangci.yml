version: "2"

run:
  build-tags:
    - e2e

linters:
  enable:
    - depguard
    - dupl
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
  settings:
    depguard:
      rules:
        # api/ is public, so it stays importable by anyone: standard library and other api/ packages only.
        api-stdlib-only:
          files: ["${base-path}/api/**", "!$test"]
          allow:
            - $gostd
            - github.com/ingvarch/tent/api
        # internal/pki makes the cluster's CA and secrets with the standard library, internal/uuid and the API types
        # alone, so it never reaches a cloud or the store. internal/uuid imports only the standard library.
        pki-stdlib-only:
          files: ["${base-path}/internal/pki/**", "!$test"]
          allow:
            - $gostd
            - github.com/ingvarch/tent/internal/uuid$
            - github.com/ingvarch/tent/api/v1alpha1$
        uuid-stdlib-only:
          files: ["${base-path}/internal/uuid/**", "!$test"]
          allow:
            - $gostd
        # internal/english writes the lists of messages for every layer, so it imports only the standard library.
        english-stdlib-only:
          files: ["${base-path}/internal/english/**", "!$test"]
          allow:
            - $gostd
        # internal/secrettest holds the checks that tests of every layer run, so it imports only the standard library.
        secrettest-stdlib-only:
          files: ["${base-path}/internal/secrettest/**", "!$test"]
          allow:
            - $gostd
        # internal/channels reads the embedded channel files with the decoder of the specs, compares versions with
        # x/mod/semver and imports nothing else.
        channels-stdlib-and-yaml:
          files: ["${base-path}/internal/channels/**", "!$test"]
          allow:
            - $gostd
            - sigs.k8s.io/yaml$
            - sigs.k8s.io/json$
            - golang.org/x/mod/semver$
        # internal/secrettest is for tests: no code that tent runs imports it.
        secrettest-only-in-tests:
          files: ["$all", "!$test"]
          deny:
            - pkg: github.com/ingvarch/tent/internal/secrettest
              desc: internal/secrettest is for tests only
        # Only cmd/tent imports provider packages, to register them (ADR-0021). No other package can reach a
        # provider, directly or through another package.
        providers-only-in-cmd:
          files: ["$all", "!$test", "!${base-path}/cmd/tent/**", "!${base-path}/internal/cloud/*/**"]
          deny:
            - pkg: github.com/ingvarch/tent/internal/cloud/
              desc: only cmd/tent imports provider packages; use the interfaces in internal/cloud (ADR-0021)
        # Each cloud SDK stays inside its own provider package (ADR-0021).
        govultr-only-in-vultr:
          files: ["$all", "!${base-path}/internal/cloud/vultr/**"]
          deny:
            - pkg: github.com/vultr/govultr
              desc: govultr is used only by internal/cloud/vultr (ADR-0021)
        hcloud-only-in-hetzner:
          files: ["$all", "!${base-path}/internal/cloud/hetzner/**"]
          deny:
            - pkg: github.com/hetznercloud/hcloud-go
              desc: hcloud-go is used only by internal/cloud/hetzner (ADR-0021)
        # No code that can create or delete cloud resources runs on a node, not even the provider interfaces.
        nodeup-no-cloud:
          files: ["${base-path}/internal/nodeup/**"]
          deny:
            - pkg: github.com/ingvarch/tent/internal/cloud$
              desc: tent-node never touches cloud APIs
            - pkg: github.com/ingvarch/tent/internal/cloud/
              desc: tent-node never touches cloud APIs
        # tent-node gets its assets, versions and sha256s, in NodeConfig: node code imports neither the package that
        # checks PGP signatures nor the channels, directly or through NodeConfig (ADR-0006, ADR-0026).
        node-no-assets:
          files:
            - "${base-path}/internal/nodeup/**"
            - "${base-path}/internal/nodeconfig/**"
            - "${base-path}/cmd/tent-node/**"
          deny:
            - pkg: github.com/ingvarch/tent/internal/assets$
              desc: tent-node carries no PGP code; its assets come in NodeConfig (ADR-0006, ADR-0026)
            - pkg: github.com/ingvarch/tent/internal/channels$
              desc: tent-node reads versions from NodeConfig, not from the channels (ADR-0006, ADR-0026)
        # Only internal/nomadops talks to Nomad (ADR-0011).
        nomad-only-in-nomadops:
          files: ["$all", "!${base-path}/internal/nomadops/**"]
          deny:
            - pkg: github.com/hashicorp/nomad
              desc: only internal/nomadops imports github.com/hashicorp/nomad/api (ADR-0011)
        # The Nomad root module is BUSL-licensed; only the MPL-2.0 api module may be imported (ADR-0011).
        nomadops-api-only:
          files: ["${base-path}/internal/nomadops/**"]
          list-mode: lax
          allow:
            - github.com/hashicorp/nomad/api
          deny:
            - pkg: github.com/hashicorp/nomad
              desc: the Nomad root module is BUSL-licensed (ADR-0011)
        # The JSON Schema libraries only generate and test the schema (ADR-0022).
        jsonschema-only-in-apischema:
          files: ["$all", "!${base-path}/internal/apischema/**"]
          deny:
            - pkg: github.com/invopop/jsonschema
              desc: the JSON Schema libraries are used only by internal/apischema (ADR-0022)
            - pkg: github.com/santhosh-tekuri/jsonschema
              desc: the JSON Schema libraries are used only by internal/apischema (ADR-0022)
        # Only internal/assets checks OpenPGP signatures, so tent-node carries no PGP code (ADR-0006, ADR-0026).
        gocrypto-only-in-assets:
          files: ["$all", "!${base-path}/internal/assets/**"]
          deny:
            - pkg: github.com/ProtonMail/go-crypto
              desc: only internal/assets checks OpenPGP signatures (ADR-0006, ADR-0026)
        # The licence classifier only checks the dependencies and writes the release's notices (ADR-0020).
        licenseclassifier-only-in-licenses:
          files: ["$all", "!${base-path}/internal/licenses/**"]
          deny:
            - pkg: github.com/google/licenseclassifier
              desc: the licence classifier is used only by internal/licenses (ADR-0020)
    forbidigo:
      forbid:
        - pattern: ^panic$
          msg: library code returns errors instead of panicking
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [forbidigo]
      - path: ^cmd/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ingvarch/tent
