name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  # By hand, only the online job runs: the other jobs skip a workflow_dispatch run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      # A module tent or tent-node links, on any platform the release builds for, may only have a licence
      # internal/licenses allows. It runs after a lint failure too, so one failure does not hide the other; the job
      # fails if either does.
      - if: success() || failure()
        run: go run ./internal/licenses/cmd/licenses ./cmd/tent ./cmd/tent-node

  test:
    name: test ${{ matrix.os }} go ${{ matrix.go }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
        # The Go in go.mod, which also builds the release.
        go: [go.mod]
        include:
          # The newest Go too, on Linux only: macOS and Windows minutes are expensive on a private repository.
          - os: ubuntu-26.04
            go: stable
    steps:
      - uses: actions/checkout@v7
      # One input per job: setup-go warns when it gets both.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
      - run: go test -race ./...

  # The s3 state store against a Cloudflare R2 bucket; the test job runs the s3 tests against the fake. Without the
  # bucket URL and its keys, as in forks, it skips. Each run writes below ci/run-<id>/ and deletes what it wrote; a
  # cancelled or timed-out run cannot, so a lifecycle rule on the bucket expires what is left.
  #
  # Setup:
  # - the repository variable TENT_TEST_S3_URL is the bucket URL ending in /ci, such as
  #   s3://tent-ci/ci?endpoint=https://<account>.r2.cloudflarestorage.com&region=auto;
  # - the secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY hold an R2 API token limited to that bucket, with
  #   Object Read & Write;
  # - a lifecycle rule on the bucket expires objects under ci/ after 1 day.
  s3:
    name: test s3 on Cloudflare R2
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - id: r2
        env:
          READY: >-
            ${{ vars.TENT_TEST_S3_URL != '' && secrets.R2_ACCESS_KEY_ID != '' &&
            secrets.R2_SECRET_ACCESS_KEY != '' }}
        run: |
          if [ "$READY" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=S3 tests skipped::TENT_TEST_S3_URL or the R2 keys are not available to this run."
          fi
      - if: steps.r2.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.r2.outputs.ready == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - if: steps.r2.outputs.ready == 'true'
        env:
          TENT_TEST_S3_URL: ${{ vars.TENT_TEST_S3_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        # -count=1: a cached pass says nothing about the bucket today.
        run: go test -race -count=1 -run '^TestS3(Store|LeaseLocker|NewLocker)$' ./internal/statestore/

  # Weekly and by hand, the tests that read public release sites: the Nomad releases tent pins still verify with the
  # HashiCorp key embedded in tent, and that key has half a year left before it expires.
  online:
    name: test online
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - env:
          TENT_TEST_ONLINE: "1"
        # -count=1: a cached pass says nothing about the release sites today.
        run: go test -count=1 -run 'Online$' ./...

  snapshot:
    name: release snapshot
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0.24.2
      - uses: goreleaser/goreleaser-action@v7
        with:
          version-file: .tool-versions
          args: release --snapshot --clean --skip=sign
      # tent reads tent-node's sha256 from checksums.txt of its release by these names (ADR-0026).
      - name: check that checksums.txt lists tent-node
        run: |
          for file in tent-node_linux_amd64 tent-node_linux_arm64; do
            if ! grep -Eq "^[0-9a-f]{64}  $file\$" dist/checksums.txt; then
              echo "::error::dist/checksums.txt lists no $file"
              exit 1
            fi
          done

  govulncheck:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ""
          go-version-file: go.mod
