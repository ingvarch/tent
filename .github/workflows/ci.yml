name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  test:
    name: test ${{ matrix.os }} go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-15, windows-2025]
        # The Go in go.mod, which also builds the release.
        go: [go.mod]
        include:
          # The newest Go too, on Linux only: macOS and Windows minutes are expensive on a private repository.
          - os: ubuntu-26.04
            go: stable
    steps:
      - uses: actions/checkout@v7
      # One input per job: setup-go warns when it gets both.
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.go == 'go.mod' && 'go.mod' || '' }}
          go-version: ${{ matrix.go != 'go.mod' && matrix.go || '' }}
      - run: go test -race ./...

  snapshot:
    name: release snapshot
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: anchore/sbom-action/download-syft@v0.24.2
      - uses: goreleaser/goreleaser-action@v7
        with:
          version-file: .tool-versions
          args: release --snapshot --clean --skip=sign

  govulncheck:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-input: ""
          go-version-file: go.mod
